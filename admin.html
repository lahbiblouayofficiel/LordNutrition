<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | LORD NUTRITION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <span class="logo-red">LORD</span><span class="logo-white">ADMIN</span>
            </a>
            <div class="header-actions">
                <a href="index.html" class="btn btn-primary" style="padding: 8px 16px;">Back to Store</a>
            </div>
        </div>
    </header>

    <main class="admin-main">
        <div class="container">
            <div class="admin-tabs" style="display: flex; gap: 10px; margin-bottom: 30px;">
                <button class="btn btn-primary" id="tabBtnProducts" onclick="switchTab('products')">Products</button>
                <button class="btn" id="tabBtnOrders" style="background: #333; color: white; display: flex; align-items: center;" onclick="switchTab('orders')">
                    Orders 
                    <span id="orderBadge" style="background: var(--primary-color); color: white; border-radius: 50%; padding: 2px 8px; font-size: 0.8rem; margin-left: 8px; display: none;">0</span>
                </button>
                <button class="btn" id="tabBtnMessages" style="background: #333; color: white; display: flex; align-items: center;" onclick="switchTab('messages')">
                    Messages 
                    <span id="msgBadge" style="background: var(--primary-color); color: white; border-radius: 50%; padding: 2px 8px; font-size: 0.8rem; margin-left: 8px; display: none;">0</span>
                </button>
            </div>

            <div id="tabProducts">
                <div class="admin-header">
                    <h2>Product Management</h2>
                    <button class="btn btn-primary" onclick="openModal()">+ Add New Product</button>
                </div>

                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <!-- Products injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="tabOrders" style="display: none;">
                <div class="admin-header">
                    <h2>Customer Orders</h2>
                </div>
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Shipping</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Orders injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="tabMessages" style="display: none;">
                <div class="admin-header">
                    <h2>Customer Messages</h2>
                </div>
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Message</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="messagesTableBody">
                            <!-- Messages injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content admin-modal">
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="productName" required>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory" required>
                        <option value="protein">Protein</option>
                        <option value="mass">Mass Gainers</option>
                        <option value="preworkout">Pre-Workout</option>
                        <option value="vitamins">Vitamins</option>
                        <option value="pack">Packs</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label>Image URL (e.g., assets/product.png)</label>
                    <input type="text" id="productImage" value="assets/product.png" required>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDesc" rows="3" required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Benefits (Comma separated)</label>
                    <input type="text" id="productBenefits" placeholder="e.g., 25g Protein, Zero Sugar">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn" style="background:#333; color:white;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex-grow: 1;">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
